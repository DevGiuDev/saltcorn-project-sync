name: Publish

# Publish saltcorn-project-sync to the npm registry using npm trusted
# publishing (GitHub Actions OIDC). No long-lived npm token is required:
# the npm registry exchanges this workflow's OIDC token for short-lived
# publish credentials, so the npm package must have this repository and
# this exact workflow path (`.github/workflows/publish.yml`) configured as
# a trusted publisher.
#
# If you configured an npm environment name when registering the trusted
# publisher, set `environment:` on the job below to that exact name. If you
# left the environment blank on npm, do not add it here either.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every gate and pack the tarball but skip the real upload
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (GitHub OIDC -> npm) needs a recent npm CLI; the
      # recipes that work use the latest release (currently 12.x). The npm
      # bundled with Node 22 is older, so upgrade it explicitly.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Show npm/node versions
        run: |
          node --version
          npm --version

      - run: npm ci --ignore-scripts

      - name: Release gate (lint, unit tests, package checks, Saltcorn smoke)
        run: npm run release:check:full

      # actions/setup-node writes a `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # line into .npmrc. For npm trusted publishing (OIDC) that line must be
      # absent: with it present, npm CLI attempts classic auth with an empty
      # token and fails with ENEEDAUTH instead of doing the OIDC exchange.
      # See npm/documentation#1960 and actions/setup-node#1551.
      - name: Strip npm auth-token line for trusted publishing (OIDC)
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            echo "--- .npmrc after strip ---"
            cat "$npmrc"
          fi
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          echo "OIDC token endpoint present: $ACTIONS_ID_TOKEN_REQUEST_URL"

      - name: Verify tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              if [ "v$version" != "$tag" ]; then
                echo "::error::Git tag '$tag' does not match package.json version 'v$version'" >&2
                exit 1
              fi
              echo "Releasing version $version (tag: $tag)"
              ;;
            *)
              echo "No tag ref (workflow_dispatch on $GITHUB_REF); skipping strict tag/version match. Package version: $version"
              ;;
          esac

      # NOTE: provenance (`--provenance`) is intentionally disabled. With the
      # current npm/sigstore stack it fails with TLOG_CREATE_ENTRY_ERROR (409
      # "an equivalent entry already exists") on deterministic, reproducible
      # builds, blocking the upload. Trusted publishing (OIDC auth) still works
      # without it; revisit provenance once that sigstore/rekor collision is
      # resolved upstream.
      - name: Publish to npm (trusted publishing via OIDC, with provenance)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        # Force the trusted-publishing (OIDC) path: npm must NOT find a token,
        # otherwise it would publish with a long-lived token instead of the
        # short-lived credentials minted from this workflow's OIDC token.
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --access public

      - name: Publish dry-run (pack only, no upload)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ""
        run: npm publish --dry-run --access public
